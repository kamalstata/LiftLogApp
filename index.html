<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b33">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LiftLog">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>LiftLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --navy:#0f1b33; --navy2:#1c2c50; --mint:#34d399; --mint-d:#059669; --red:#ef4444; --amber:#f59e0b;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 8px;max-width:560px;margin:0 auto}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--mint-d)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--mint)} .dot.local{background:var(--amber)}
h2{font-size:20px;margin:18px 0 10px;letter-spacing:-.01em}
h3{margin:0;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:600;background:var(--navy);color:#fff}
.btn.mint{background:var(--mint);color:#053b2b}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:#e9edf5;font-weight:600;font-size:13px;color:var(--muted)}
.chip.on{background:var(--navy);color:#fff}

/* timer panel */
.timer{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;border-radius:20px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.tbox{background:rgba(255,255,255,.06);border-radius:14px;padding:12px;text-align:center}
.tlabel{font-size:11px;letter-spacing:.12em;opacity:.7}
.tval{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 8px}
.tval.rest{color:var(--mint)} .tval.over{color:var(--amber)}
.tbtns{display:flex;gap:6px;justify-content:center}
.tbtn{padding:7px 10px;border-radius:10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);color:#fff}
.tbtn.mint{background:var(--mint);color:#053b2b}
.progress{height:6px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;background:var(--mint)}

/* exercise */
.ex-head{display:flex;gap:12px;align-items:center}
.ex-ico{width:38px;height:38px;border-radius:10px;background:#eef2f7;display:grid;place-items:center;flex:none}
.ex-ico.done{background:#d1fae5;color:var(--mint-d)}
.prev{background:#f1f5f9;border-radius:10px;padding:8px 10px;font-size:12.5px;margin:12px 0 8px}
.prev b{display:block;font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:2px}
.sets{width:100%;border-collapse:collapse}
.sets th{font-size:11px;letter-spacing:.08em;color:var(--muted);text-align:left;padding:4px 2px;font-weight:700}
.sets td{padding:5px 2px;vertical-align:middle}
.num{width:100%;padding:10px 8px;border:1px solid var(--line);border-radius:999px;text-align:center;background:#fff;font-weight:600;font-size:16px}
.tick{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin:auto}
.tick.on{background:var(--ink);border-color:var(--ink);color:#fff}
.diff{font-size:11px;font-weight:700}
.up{color:var(--mint-d)} .down{color:var(--red)}
.linkbtn{color:var(--mint-d);font-weight:600;font-size:13px}
.x{color:var(--muted);font-size:18px;padding:4px 8px}

/* technique */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:10px}
.lib-item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#eef2f7;color:var(--muted)}
.detail h4{margin:16px 0 6px;font-size:12px;letter-spacing:.1em;color:var(--muted)}
.detail ol,.detail ul{margin:0;padding-left:20px;line-height:1.55}
.detail li{margin-bottom:4px}
.cue{background:#ecfdf5;border-left:3px solid var(--mint);padding:10px 12px;border-radius:8px;margin:6px 0;font-weight:500}
.warn li::marker{color:var(--red)}
.figcard{background:linear-gradient(180deg,#f8fafc,#eef2f7);border-radius:14px;padding:6px 6px 10px;margin:12px 0 4px;position:relative}
.figcard .figsvg{display:block;width:100%;height:auto}
.figcard.bad{background:linear-gradient(180deg,#fff5f5,#fee2e2)}
.phase{position:absolute;top:10px;left:12px;font-size:11px;font-weight:800;letter-spacing:.1em;padding:4px 9px;border-radius:999px;background:#fff;color:var(--mint-d)}
.phase.lower{color:#2563eb}.phase.hold{color:var(--muted)}
.badlabel{position:absolute;top:10px;right:12px;left:auto;font-size:11px;font-weight:700;color:#b91c1c;background:#fff;padding:4px 9px;border-radius:999px;max-width:60%;text-align:right}
.seg{display:flex;background:#e9edf5;border-radius:12px;padding:3px;gap:3px}
.btn.sm{white-space:nowrap}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on.badon{color:#b91c1c}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.thumb{width:64px;height:48px;flex:none;border-radius:10px;background:#f1f5f9;overflow:hidden}
.thumb svg{width:100%;height:100%}
/* today */
.lvl{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #f1d38a;border-radius:12px;padding:6px 10px}
.lvl b{font-size:14px}.lvl i{display:block;width:44px;height:5px;border-radius:5px;background:#f1f5f9;overflow:hidden}.lvl i u{display:block;height:100%;background:#f59e0b}
.lvl span{font-size:11px;color:var(--muted);font-weight:600}
.hero{background:linear-gradient(120deg,var(--navy),#24406e 70%,#2f5a6b);color:#fff;border-radius:18px;padding:16px;margin:10px 0}
.hero-t{font-size:20px;font-weight:800;letter-spacing:-.01em}.hero-s{opacity:.82;margin-top:6px;line-height:1.45}
.streaks{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.streak{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.sdot{width:9px;height:9px;border-radius:50%;flex:none}.sdot.g{background:var(--mint)}.sdot.y{background:var(--amber)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.navb{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:22px}
.navb:disabled{opacity:.35}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa-b{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 6px;border-radius:12px;background:#f1f5f9;font-weight:700;font-size:14px}
.qa-b.on{background:var(--navy);color:#fff}
.hr{height:1px;background:var(--line);margin:14px 0}
.wbtns{display:grid;grid-template-columns:1fr 1fr 1fr .6fr;gap:8px}
.wbtns button{padding:12px 4px;border-radius:12px;background:#f1f5f9;font-weight:700}
.wbtns button:active{background:#e0f2fe}
.rowbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.rowbtn b{white-space:nowrap}.ell{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.habits{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.habit{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px}
.habit.on{background:#d1fae5;border-color:#a7f3d0;color:#065f46}.habit.add{color:var(--muted);border-style:dashed}
.sos{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:1.5px dashed #f1c27d;background:#fffbeb;color:#92400e;font-weight:700}
.chk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 4px;font-weight:600}
.chk i{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:14px}
.chk.on i{background:var(--mint);border-color:var(--mint);color:#053b2b}
.sosbox{background:#f8fafc;border-radius:12px;padding:12px;margin:8px 0;line-height:1.45}
.yt{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}

/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.bottom .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
nav.bottom button.on{color:var(--navy)}
nav.bottom svg{width:22px;height:22px}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--navy);color:#fff;border-radius:14px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;z-index:19;box-shadow:0 8px 24px rgba(15,27,51,.3)}
.restbar.show{display:flex}
.restbar .v{font-weight:800;font-size:20px;color:var(--mint);font-variant-numeric:tabular-nums}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:#f1f5f9;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:var(--muted)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Lift<span>Log</span></div>
  <button class="sync" data-a="sync-tap"><i class="dot" id="syncDot"></i><span id="syncTxt">Loading…</span></button>
</header>
<main class="wrap" id="view"></main>

<div class="restbar" id="restbar">
  <div><div class="small" style="opacity:.7">Rest</div><div class="v" id="restbarV">0:00</div></div>
  <div class="row">
    <button class="tbtn" data-a="rest-add" data-v="-15">−15s</button>
    <button class="tbtn" data-a="rest-add" data-v="15">+15s</button>
    <button class="tbtn mint" data-a="rest-skip">Skip</button>
  </div>
</div>

<nav class="bottom"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
  <button data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Workout</button>
  <button data-tab="technique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2V5z"/><path d="M8 7h6M8 11h6"/></svg>Technique</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>History</button>
  <button data-tab="plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Plans</button>
</div></nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== LiftLog animated technique figures (original stick-figure engine) ===== */

const L={torso:60,ua:32,fa:30,th:42,sh:40,neck:22,head:10};
const R=d=>d*Math.PI/180;

   A:{anchor:"hip",ax:178,ay:155,torso:235,ua:8,fa:172,th:80,sh:0},
   B:{anchor:"hip",ax:178,ay:155,torso:235,ua:150,fa:150,th:80,sh:0},

 "lateral-raise":{view:"front",hold:"db",tempo:[1.2,2.2],hl:["ua"],

   props:'<rect x="100" y="160" width="70" height="10" rx="4" class="pr"/><rect x="140" y="170" width="8" height="30" class="pr"/><circle cx="178" cy="148" r="7" class="pr"/>',
   A:{anchor:"hip",ax:132,ay:158,torso:188,ua:174,fa:178,th:90,sh:0},
   B:{anchor:"hip",ax:132,ay:158,torso:192,ua:-18,fa:158,th:90,sh:0},
   M:{label:"Swinging the torso back",B:{torso:228,ua:-5,fa:150}}},

   props:'<rect x="70" y="170" width="70" height="10" rx="4" class="pr"/><rect x="186" y="150" width="8" height="40" rx="3" class="pr"/><line x1="40" y1="190" x2="270" y2="190" class="pr2"/>',
   A:{anchor:"hip",ax:108,ay:166,torso:166,ua:92,fa:92,th:100,sh:78},

   M:{label:"Rocking the body back and forth",A:{torso:135,ua:100,fa:100},B:{torso:212,ua:-30,fa:100}}},
 "db-row":{view:"side",hold:"db",tempo:[1,2],hl:["ua","torso"],
   A:{anchor:"foot",ax:140,ay:200,torso:100,ua:0,fa:0,th:25,sh:-5},
   B:{anchor:"foot",ax:140,ay:200,torso:100,ua:-96,fa:2,th:25,sh:-5},
   M:{label:"Twisting / jerking the torso up",B:{torso:132,ua:-80,fa:10}}},
 "bicep-curl":{view:"side",hold:"db",tempo:[1,2],hl:["fa"],
   A:{anchor:"foot",ax:150,ay:200,torso:180,ua:4,fa:4,th:0,sh:0},
   B:{anchor:"foot",ax:150,ay:200,torso:180,ua:8,fa:158,th:0,sh:0},
   M:{label:"Swinging with the hips",B:{torso:200,ua:40,fa:170,th:-8,sh:5}}},
 "squat":{view:"side",ecc:1,hold:"backbar",tempo:[2,1.4],hl:["th","sh"],
   A:{anchor:"foot",ax:150,ay:200,torso:180,ua:-30,fa:168,th:0,sh:0},
   B:{anchor:"foot",ax:150,ay:200,torso:142,ua:-35,fa:170,th:82,sh:-35},
   M:{label:"Chest collapsing forward",B:{torso:108,ua:0,fa:120}}},
 "leg-press":{view:"side",ecc:1,hold:"none",plate:true,tempo:[2,1.4],hl:["th","sh"],
   props:'<line x1="98" y1="152" x2="56" y2="110" class="bench"/><line x1="70" y1="152" x2="120" y2="152" class="bench"/><line x1="96" y1="155" x2="96" y2="200" class="pr2"/>',
   A:{anchor:"hip",ax:100,ay:144,torso:225,ua:20,fa:60,th:150,sh:68},
   B:{anchor:"hip",ax:100,ay:144,torso:225,ua:20,fa:60,th:116,sh:114},
   M:{label:"Too deep — hips curl off the pad",A:{ax:104,ay:136,torso:205,th:172,sh:46}}},
 "rdl":{view:"side",ecc:1,hold:"bar",tempo:[2,1.4],hl:["th","torso"],

function lerp(a,b,t){const o={};for(const k in a){o[k]=typeof a[k]==="number"&&typeof b[k]==="number"?a[k]+(b[k]-a[k])*t:a[k]}return o}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function poseAt(def,mistake,time){
  let A=def.A,B=def.B;
  if(mistake&&def.M){A=Object.assign({},A,def.M.A||{});B=Object.assign({},B,def.M.B||{});}
  const [up,down]=def.tempo||[1.2,2], hold=.35, T=up+down+hold*2;
  let t=time%T, k;
  if(t<up)k=ease(t/up); else if(t<up+hold)k=1; else if(t<up+hold+down)k=1-ease((t-up-hold)/down); else k=0;
  return {p:lerp(A,B,k),k};
}

function line(a,b,cls){return `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" class="${cls}"/>`}
function grip(h,hold,angle){
  if(hold==="bar")return `<circle cx="${f(h[0])}" cy="${f(h[1])}" r="9" class="plate"/><circle cx="${f(h[0])}" cy="${f(h[1])}" r="3" class="hub"/>`;
  if(hold==="db")return `<rect x="${f(h[0]-8)}" y="${f(h[1]-4)}" width="16" height="8" rx="3" class="plate"/>`;
  if(hold==="handle")return `<circle cx="${f(h[0])}" cy="${f(h[1])}" r="4" class="hub"/>`;
  return "";
}

function side(def,p,bad){
  const c=bad?"lim bad":"lim", hl=k=>(!bad&&(def.hl||[]).includes(k))?" hl":"";
  let hip,knee,ankle;
  if(p.anchor==="foot"){ankle=[p.ax,p.ay];knee=sub(ankle,dir(p.sh,L.sh));hip=sub(knee,dir(p.th,L.th));}
  else{hip=[p.ax,p.ay];knee=add(hip,dir(p.th,L.th));ankle=add(knee,dir(p.sh,L.sh));}
  const sho=add(hip,dir(p.torso,L.torso)), head=add(sho,dir(p.torso,L.neck));
  const elb=add(sho,dir(p.ua,L.ua)), hand=add(elb,dir(p.fa,L.fa));
  const toe=p.anchor==="foot"?[ankle[0]+14,ankle[1]]:add(ankle,dir(p.foot!=null?p.foot:p.sh+90,12));
  let s="";
  if(def.cable){const px=def.cable[0],py=def.cable[1]==="hand"?hand[1]:def.cable[1];s+=`<line x1="${px}" y1="${f(py)}" x2="${f(hand[0])}" y2="${f(hand[1])}" class="cable"/><circle cx="${px}" cy="${f(py)}" r="5" class="pr"/>`}
  s+=line(hip,knee,c+hl("th"))+line(knee,ankle,c+hl("sh"))+line(ankle,toe,c);
  s+=line(hip,sho,c+hl("torso"))+`<circle cx="${f(head[0])}" cy="${f(head[1])}" r="${L.head}" class="head${bad?" bad":""}"/>`;
  s+=line(sho,elb,c+hl("ua"))+line(elb,hand,c+hl("fa"));
  [hip,knee,sho,elb].forEach(j=>s+=`<circle cx="${f(j[0])}" cy="${f(j[1])}" r="3.2" class="jt"/>`);
  if(def.hold==="backbar")s+=grip(add(sho,dir(p.torso+90,-4)),"bar");
  else s+=grip(hand,def.hold);
  if(def.plate){const a=Math.atan2(ankle[1]-hip[1],ankle[0]-hip[0])+Math.PI/2,dx=Math.cos(a)*22,dy=Math.sin(a)*22;
    s+=`<line x1="${f(toe[0]+dx)}" y1="${f(toe[1]+dy)}" x2="${f(toe[0]-dx)}" y2="${f(toe[1]-dy)}" class="bench"/>`}
  if(def.pad)s+=`<circle cx="${f(ankle[0])}" cy="${f(ankle[1])}" r="6" class="pad"/>`;
  return s;
}
function front(def,p,bad){
  const c=bad?"lim bad":"lim", hlc=!bad&&(def.hl||[]).includes("ua")?" hl":"";
  const cx=150, hipY=118, shY=60-(p.shrug||0), neck=[cx,60];

  s+=`<path d="M${cx-10} ${hipY} L${cx-20} ${shY} L${cx+20} ${shY} L${cx+10} ${hipY} Z" class="torso${bad?" bad":""}"/>`;
  s+=`<circle cx="${cx}" cy="38" r="12" class="head${bad?" bad":""}"/>`;
  [-1,1].forEach(m=>{const sh=[cx+20*m,shY],e=[sh[0]+m*Math.sin(R(p.ua))*L.ua,sh[1]+Math.cos(R(p.ua))*L.ua],h=[e[0]+m*Math.sin(R(p.fa))*L.fa,e[1]+Math.cos(R(p.fa))*L.fa];
    s+=line(sh,e,c+hlc)+line(e,h,c)+`<circle cx="${f(e[0])}" cy="${f(e[1])}" r="3.2" class="jt"/>`+grip(h,def.hold)});
  return s;
}
function top(def,p,bad){
  const c=bad?"lim bad":"lim", hlc=!bad&&(def.hl||[]).includes("ua")?" hl":"";

  let s=`<rect x="${cx-34}" y="${cy-6}" width="68" height="60" rx="10" class="pr"/>`;
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="26" ry="11" class="torso${bad?" bad":""}"/><circle cx="${cx}" cy="${cy-3}" r="11" class="head${bad?" bad":""}"/>`;
  [-1,1].forEach(m=>{const sh=[cx+24*m,cy],e=[sh[0]+m*Math.sin(R(p.ua))*L.ua*1.15,sh[1]+Math.cos(R(p.ua))*L.ua*1.15],h=[e[0]+m*Math.sin(R(p.fa))*L.fa*1.15,e[1]+Math.cos(R(p.fa))*L.fa*1.15];
    s+=line(sh,e,c+hlc)+line(e,h,c)+`<circle cx="${f(e[0])}" cy="${f(e[1])}" r="3.2" class="jt"/>`+grip(h,def.hold)});
  s+=`<text x="${cx}" y="22" text-anchor="middle" class="lbl">view from above</text>`;
  return s;
}

function svg(id,mistake,time){
  const def=D[id]; if(!def)return "";
  const {p,k}=poseAt(def,mistake,time);
  const bad=!!(mistake&&def.M);
  const body=def.view==="front"?front(def,p,bad):def.view==="top"?top(def,p,bad):side(def,p,bad);
  return `<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg" class="figsvg">
  <style>.lim{stroke:#1e293b;stroke-width:7;stroke-linecap:round}.lim.hl{stroke:#10b981}.lim.bad{stroke:#ef4444}.jt{fill:#fff;stroke:#1e293b;stroke-width:1.5}
  .head{fill:#1e293b}.head.bad{fill:#ef4444}.torso{fill:#1e293b}.torso.bad{fill:#ef4444}.pr{fill:#cbd5e1}.pr2{stroke:#cbd5e1;stroke-width:4}
  .bench{stroke:#94a3b8;stroke-width:8;stroke-linecap:round}.plate{fill:#334155}.hub{fill:#94a3b8}.cable{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:3 3}
  .pad{fill:#f59e0b}.floor{stroke:#e2e8f0;stroke-width:2}.lbl{font:600 10px Inter,sans-serif;fill:#94a3b8;letter-spacing:.08em}</style>
  ${def.view!=="top"?'<line x1="20" y1="201" x2="280" y2="201" class="floor"/>':""}
  ${def.props&&def.view==="side"?def.props:""}
  ${body}
  </svg>`;
}
return {svg,has:id=>!!D[id],mistake:id=>D[id]&&D[id].M?D[id].M.label:null,tempo:id=>D[id].tempo,ecc:id=>!!D[id].ecc,poseAt:(id,m,t)=>poseAt(D[id],m,t)};
})();

async function onToken(r){
  if(!r||r.error){toast("Sign-in failed");return status()}
  if(!google.accounts.oauth2.hasGrantedAllScopes(r,DRIVE_SCOPE)){toast("Please allow LiftLog to create its own sheet");return status()}
  G.token=r.access_token; G.exp=Date.now()+(+r.expires_in||3600)*1000;
  try{
    const info=await api("https://www.googleapis.com/oauth2/v3/userinfo");
    if(S.owner&&info.email&&S.owner!==info.email){ // different person on this phone → load their data, not the previous person's
      S.history=[];S.deleted=[];S.plansU=0;S.dirty=false;G.sheetId=null;toast("Switched to "+info.email);
    }
    G.email=info.email||G.email; saveG();
  }catch(e){}
  await sync(true);
}
function signOut(){
  try{if(G.token)google.accounts.oauth2.revoke(G.token,()=>{})}catch(e){}
  Object.assign(G,{token:null,exp:0,email:null,sheetId:null}); saveG(); status(); render(); toast("Signed out — your data stays on this phone and in your sheet");
}

async function api(url,opt={}){
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:"Bearer "+G.token,"Content-Type":"application/json"},opt.headers||{})}));
  if(r.status===401){G.token=null;G.exp=0;saveG();throw new Error("auth")}
  if(!r.ok)throw new Error("HTTP "+r.status+": "+(await r.text()).slice(0,200));
  return r.status===204?null:r.json();
}
const SHEETS="https://sheets.googleapis.com/v4/spreadsheets";

async function ensureSheet(){
  if(G.sheetId){
    try{const f=await api(`https://www.googleapis.com/drive/v3/files/${G.sheetId}?fields=id,trashed`);if(f.trashed)G.sheetId=null}
    catch(e){if(e.message==="auth")throw e;G.sheetId=null}
  }
  if(!G.sheetId){
    const q=encodeURIComponent(`name='${SHEET_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`);
    const l=await api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&orderBy=createdTime`);
    if(l.files&&l.files.length)G.sheetId=l.files[0].id;
    else{
      const s=await api(SHEETS,{method:"POST",body:JSON.stringify({properties:{title:SHEET_NAME},
        sheets:TABS.map(t=>({properties:{title:t,gridProperties:{frozenRowCount:1}}}))})});
      G.sheetId=s.spreadsheetId;
    }
    saveG();
  }
  // re-create any tab the user deleted by hand
  const meta=await api(`${SHEETS}/${G.sheetId}?fields=sheets.properties.title`);
  const have=(meta.sheets||[]).map(s=>s.properties.title), miss=TABS.filter(t=>!have.includes(t));
  if(miss.length)await api(`${SHEETS}/${G.sheetId}:batchUpdate`,{method:"POST",body:JSON.stringify({requests:miss.map(t=>({addSheet:{properties:{title:t,gridProperties:{frozenRowCount:1}}}}))})});
}

const pad=n=>String(n).padStart(2,"0");
const dstr=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dparse=s=>{const t=new Date(String(s).replace(" ","T")).getTime();return isNaN(t)?Date.now():t};

async function readAll(){
  const qs=TABS.map(t=>"ranges="+encodeURIComponent(t+"!A:H")).join("&");
  const r=await api(`${SHEETS}/${G.sheetId}/values:batchGet?${qs}`);
  const [W,St,P,Dy,Se]=(r.valueRanges||[]).map(v=>(v.values||[]).slice(1));
  const hist=new Map();
  (W||[]).forEach(w=>{if(w[0])hist.set(String(w[0]),{id:String(w[0]),date:dparse(w[1]),planName:w[2]||"Workout",duration:Math.round(num(w[3])*60),volume:num(w[4]),exercises:[]})});
  (St||[]).forEach(s=>{const h=hist.get(String(s[0]));if(!h)return;
    let ex=h.exercises.find(e=>e.name===s[2]); if(!ex){ex={exId:s[7]||null,name:s[2]||"Exercise",sets:[]};h.exercises.push(ex)}
    ex.sets.push({kg:num(s[4]),reps:num(s[5]),done:true})});
  const plans=[];
  (P||[]).forEach(p=>{if(!p[0])return;let pl=plans.find(x=>x.id===String(p[0]));if(!pl){pl={id:String(p[0]),name:p[1]||"Plan",items:[]};plans.push(pl)}
    if(p[3])pl.items.push({name:p[3],exId:p[4]||null,sets:Math.max(1,num(p[5])||3),reps:num(p[6])})});
  const set={};(Se||[]).forEach(r=>{if(r[0])set[r[0]]=r[1]});
  const days={},ids=v=>String(v||"").split(",").filter(Boolean).reduce((o,k)=>(o[k]=true,o),{});
  (Dy||[]).forEach(r=>{if(r[0])days[String(r[0])]={water:num(r[1]),supps:ids(r[5]),habits:ids(r[6]),u:num(r[7])}});
  const js=(v,d)=>{try{const x=JSON.parse(v);return Array.isArray(x)?x:d}catch(e){return d}};
  return {history:[...hist.values()],plans,plansU:num(set.plansUpdated),rest:num(set.restSeconds),days,
    supps:js(set.suppsJson,null),habits:js(set.habitsJson,null),waterTarget:num(set.waterTargetMl),weeklyTarget:num(set.weeklyTarget),name:set.name,
    deleted:String(set.deletedIds||"").split(",").filter(Boolean)};
}

function merge(R){
  const del=new Set([...(S.deleted||[]),...R.deleted]); S.deleted=[...del];
  const m=new Map();
  R.history.forEach(h=>{if(!del.has(h.id))m.set(h.id,h)});
  S.history.forEach(h=>{if(!del.has(h.id))m.set(h.id,h)});
  S.history=[...m.values()].sort((a,b)=>a.date-b.date);
  if(R.plans.length&&R.plansU>(S.plansU||0)){
    S.plans=R.plans;S.plansU=R.plansU;if(R.rest)S.settings.rest=R.rest;
    if(R.supps)S.supps=R.supps; if(R.habits)S.habits=R.habits;
    if(R.waterTarget)S.settings.waterTarget=R.waterTarget; if(R.weeklyTarget)S.settings.weeklyTarget=R.weeklyTarget;
    if(R.name!=null)S.settings.name=String(R.name);
  }
  S.days=S.days||{};
  Object.entries(R.days).forEach(([k,d])=>{if(!S.days[k]||(d.u||0)>(S.days[k].u||0))S.days[k]=d});
}

async function writeAll(){
  const W=[["Workout ID","Date","Plan","Duration (min)","Volume (kg)","Sets done"]],
        St=[["Workout ID","Date","Exercise","Set #","Weight (kg)","Reps","Volume (kg)","Library ID"]],
        P=[["Plan ID","Plan","Order","Exercise","Library ID","Sets","Target reps"]];
  S.history.forEach(h=>{
    W.push([h.id,dstr(h.date),h.planName,+(h.duration/60).toFixed(1),Math.round(h.volume),h.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0)]);
    h.exercises.forEach(e=>e.sets.filter(s=>s.done).forEach((s,i)=>St.push([h.id,dstr(h.date),e.name,i+1,num(s.kg),num(s.reps),num(s.kg)*num(s.reps),e.exId||""])));
  });
  S.plans.forEach(p=>p.items.length?p.items.forEach((it,i)=>P.push([p.id,p.name,i+1,it.name,it.exId||"",it.sets,it.reps])):P.push([p.id,p.name,"","","","",""]));
  const on=o=>Object.keys(o||{}).filter(k=>o[k]);
  const Dy=[["Date","Water (ml)","Water goal met","Supplements taken","Habits done","Supplement IDs","Habit IDs","Updated"]];
  Object.keys(S.days||{}).sort().forEach(k=>{const d=S.days[k];
    Dy.push([k,d.water||0,(d.water||0)>=S.settings.waterTarget?"Yes":"No",
      on(d.supps).map(id=>(S.supps.find(x=>x.id===id)||{}).name).filter(Boolean).join(", "),
      on(d.habits).map(id=>(S.habits.find(x=>x.id===id)||{}).name).filter(Boolean).join(", "),
      on(d.supps).join(","),on(d.habits).join(","),d.u||0])});
  const Se=[["Key","Value"],["plansUpdated",S.plansU||0],["restSeconds",S.settings.rest],
    ["waterTargetMl",S.settings.waterTarget],["weeklyTarget",S.settings.weeklyTarget],["name",S.settings.name||""],
    ["suppsJson",JSON.stringify(S.supps||[])],["habitsJson",JSON.stringify(S.habits||[])],["deletedIds",(S.deleted||[]).join(",")],["lastSync",dstr(Date.now())],["app","LiftLog PWA v1"]];
  const all=[["Workouts",W],["Sets",St],["Plans",P],["Daily",Dy],["Settings",Se]];
  await api(`${SHEETS}/${G.sheetId}/values:batchUpdate`,{method:"POST",body:JSON.stringify({valueInputOption:"RAW",
    data:all.map(([t,v])=>({range:`${t}!A1`,values:v}))})});
  // clear leftover rows below the new data (e.g. after a delete)
  await api(`${SHEETS}/${G.sheetId}/values:batchClear`,{method:"POST",body:JSON.stringify({ranges:all.map(([t,v])=>`${t}!A${v.length+1}:H`)})});
}

async function sync(fromSignIn){
  if(G.busy){G.again=true;return}
  if(!tokenOk()){if(!fromSignIn&&G.email&&configured())signIn();return status()}
  G.busy=true; status();
  try{
    await ensureSheet();
    merge(await readAll());
    await writeAll();
    S.dirty=false; S.lastSync=Date.now(); S.owner=G.email; lsSet();
    const a=document.activeElement; if(!(a&&a.tagName==="INPUT"))render();
  }catch(e){
    console.warn("LiftLog sync:",e);
    G.busy=false; status();
    toast(e.message==="auth"?"Google sign-in expired — tap to sync":"Sync failed — saved on this phone, will retry");
    return;
  }
  G.busy=false; status();
  if(G.again){G.again=false;sync()}
}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const fmtDate=t=>new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800)}
function lastFor(name){
  for(let i=S.history.length-1;i>=0;i--){const ex=S.history[i].exercises.find(e=>e.name.toLowerCase()===name.toLowerCase());if(ex)return{date:S.history[i].date,sets:ex.sets.filter(s=>s.done)}}
  return null;
}
function volume(exs){return exs.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+num(s.kg)*num(s.reps),0),0)}
function bestSet(sets){return sets.reduce((b,s)=>(!b||num(s.kg)>num(b.kg)||(num(s.kg)===num(b.kg)&&num(s.reps)>num(b.reps)))?s:b,null)}

/* ================= TIMERS ================= */
let rest={end:0,paused:null,total:0}, audioCtx=null;
function beep(){
  try{
    if(!audioCtx)return;
    [0,0.25,0.5].forEach(t=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.25,audioCtx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+t+.2);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+.22)});
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
function unlockAudio(){try{if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)audioCtx=new A()}if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume()}catch(e){}}
function startRest(sec){rest={end:Date.now()+sec*1000,paused:null,total:sec,fired:false};tickTimers()}
function restLeft(){if(rest.paused!=null)return rest.paused;if(!rest.end)return 0;return (rest.end-Date.now())/1000}
function tickTimers(){
  const left=restLeft(), active=rest.end||rest.paused!=null;
  if(active&&left<=0&&!rest.fired&&rest.paused==null){rest.fired=true;beep();toast("Rest over — next set!");}
  const bar=document.getElementById("restbar");
  const showBar=active&&!(left<-30);
  bar.classList.toggle("show",!!(showBar&&tab!=="workout"||showBar&&!document.getElementById("restV")));
  document.getElementById("restbarV").textContent=left>=0?fmt(left):"+"+fmt(-left);
  const rv=document.getElementById("restV");
  if(rv){rv.textContent=active?(left>=0?fmt(left):"+"+fmt(-left)):fmt(S.settings.rest);rv.className="tval "+(active&&left<0?"over":"rest");
    const pb=document.getElementById("restPause");if(pb)pb.textContent=rest.paused!=null?"RESUME":"PAUSE";
    const rl=document.getElementById("restLabel");if(rl)rl.textContent=active?(left>=0?"Resting after completed set · "+rest.total+"s":"Rest finished — go!"):"Tick DONE on a set to start rest";}
  const sv=document.getElementById("sessV");
  if(sv&&S.active)sv.textContent=fmt((Date.now()-S.active.start)/1000);
  if(active&&left<-30){rest={end:0,paused:null,total:0}}
}
setInterval(tickTimers,250);

function render(){
  document.querySelectorAll("nav.bottom button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const v=document.getElementById("view");
  normalize();
  v.innerHTML = tab==="today"?vToday(): tab==="workout"?vWorkout(): tab==="technique"?vTechnique(): tab==="history"?vHistory(): vPlans();
  tickTimers();
}

const pad2=n=>String(n).padStart(2,"0");
const dayKey=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`};
const keyToDate=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
let viewOffset=0; // 0 = today, -1 = yesterday …
const viewKey=()=>dayKey(Date.now()+viewOffset*864e5);
function day(k){return S.days[k]||{water:0,supps:{},habits:{},u:0}}
function dayW(k){if(!S.days[k])S.days[k]={water:0,supps:{},habits:{},u:0};return S.days[k]}
function dayChanged(k){S.days[k].u=Date.now();markDirty()}

function normalize(){
  const d=DEFAULT_STATE();
  S.settings=Object.assign(d.settings,S.settings||{});
  if(!S.days)S.days={};
  if(!S.supps)S.supps=d.supps;
  if(!S.habits)S.habits=d.habits;
}

/* --- XP & level: earned from what you actually log --- */
function xpTotal(){
  let x=0;
  S.history.forEach(h=>x+=50+2*h.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0));
  Object.values(S.days).forEach(dd=>{
    if(dd.water>=S.settings.waterTarget)x+=10;
    if(S.supps.length&&S.supps.every(s=>dd.supps&&dd.supps[s.id]))x+=10;
    x+=5*Object.values(dd.habits||{}).filter(Boolean).length;
  });
  return x;
}
function levelInfo(){const xp=xpTotal(),L=Math.floor(Math.sqrt(xp/50))+1,lo=50*(L-1)**2,hi=50*L**2;return{xp,L,pct:Math.round((xp-lo)/(hi-lo)*100),toNext:hi-xp}}

function habitStreak(id){
  let n=0,t=Date.now();
  if(!day(dayKey(t)).habits[id])t-=864e5;          // today not ticked yet → count from yesterday
  while(day(dayKey(t)).habits[id]){n++;t-=864e5}
  return n;
}
function weekWorkouts(){
  const now=new Date(),mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7)).getTime();
  return S.history.filter(h=>h.date>=mon).length;
}

  if(S.active)return "Workout in progress — keep going. Tick each set as you finish it.";
  if(last&&dayKey(last.date)===dayKey(Date.now()))return "Great work today! Refuel with protein and keep drinking water.";
  if(h>=12&&today.water<S.settings.waterTarget*0.3)return `Drink some water first — you're only at ${(today.water/1000).toFixed(2)} L today.`;
  if(last){const d=Math.floor((Date.now()-last.date)/864e5);if(d>=3)return `It's been ${d} days since your last workout. Even a short session counts today.`}
  else return "Welcome! Start with a plan on the Workout tab — your first session sets your baseline.";
  return TIPS[Math.floor(Date.now()/864e5)%TIPS.length];
}

function todayAction(a,t){
  const k=viewKey();
  switch(a){
    case "day-prev": viewOffset--; render(); return true;
    case "day-next": if(viewOffset<0)viewOffset++; render(); return true;
    case "go-workout": tab="workout"; render(); window.scrollTo(0,0); return true;
    case "go-tech": tab="technique"; libOpen=null; render(); window.scrollTo(0,0); return true;
    case "idea": openModal(`<div class="row between"><h3>💡 Tip</h3><button class="x" data-a="close">×</button></div><p style="font-size:16px;line-height:1.5">${esc(TIPS[Math.floor(Math.random()*TIPS.length)])}</p><button class="btn ghost block" data-a="idea">Another tip</button>`); return true;
    case "water": {const dd=dayW(k),before=dd.water;dd.water=Math.max(0,dd.water+ +t.dataset.v);dayChanged(k);
      if(before<S.settings.waterTarget&&dd.water>=S.settings.waterTarget)toast("Water goal reached! +10 XP 💧");render();return true}
    case "supps": suppsModal(); return true;
    case "supp-tick": {const dd=dayW(k);dd.supps[t.dataset.id]=!dd.supps[t.dataset.id];dayChanged(k);suppsModal();render();return true}
    case "supp-add": {const n=document.getElementById("suppName").value.trim();if(!n)return true;S.supps.push({id:uid(),name:n,time:document.getElementById("suppTime").value});S.plansU=Date.now();markDirty();suppsModal();render();return true}
    case "supp-del": S.supps=S.supps.filter(s=>s.id!==t.dataset.id); S.plansU=Date.now(); markDirty(); suppsModal(); render(); return true;
    case "habit": {const dd=dayW(k);dd.habits[t.dataset.id]=!dd.habits[t.dataset.id];dayChanged(k);if(dd.habits[t.dataset.id])toast("+5 XP");render();return true}
    case "edit-habits": habitsModal(); return true;
    case "habit-add": {const n=document.getElementById("habitName").value.trim();if(!n)return true;S.habits.push({id:uid(),name:n});S.plansU=Date.now();markDirty();habitsModal();render();return true}
    case "habit-del": S.habits=S.habits.filter(h=>h.id!==t.dataset.id); S.plansU=Date.now(); markDirty(); habitsModal(); render(); return true;
    case "sos": sosModal(); return true;
    case "sos-go": closeModal(); tab="workout"; render(); window.scrollTo(0,0); return true;
    case "lvl-info": levelModal(); return true;
  }
  return false;
}

  <label class="field" style="margin-top:10px"><span>Plan name</span><input value="${esc(p.name)}" data-in="pname"></label>
  ${p.items.map((it,i)=>`<div class="card" style="padding:12px"><div class="row between"><b>${esc(it.name)}</b><div class="row">
    <button class="x" data-a="pmove" data-i="${i}" data-d="-1">↑</button><button class="x" data-a="pmove" data-i="${i}" data-d="1">↓</button><button class="x" data-a="pdel" data-i="${i}">×</button></div></div>
    <div class="row" style="margin-top:6px"><label class="field" style="flex:1;margin:0"><span>Sets</span><input type="number" value="${it.sets}" data-in="pset" data-i="${i}"></label>
    <label class="field" style="flex:1;margin:0"><span>Target reps</span><input type="number" value="${it.reps}" data-in="preps" data-i="${i}"></label></div></div>`).join("")}
  <button class="btn ghost block" data-a="padd">+ Add exercise</button>
  <div class="row" style="margin-top:12px"><button class="btn mint" style="flex:1" data-a="psave">Save plan</button>${p._new?"":`<button class="btn danger" data-a="pdelete">Delete</button>`}</div>`);
}

/* ================= ACTIONS ================= */
function startWorkout(plan){
  S.active={planId:plan?plan.id:null,planName:plan?plan.name:"Workout",start:Date.now(),
    exercises:plan?plan.items.map(it=>newEx(it.exId,it.name,it.sets,it.reps)):[]};
  collapsed={}; touch(); render(); window.scrollTo(0,0);
}
function newEx(exId,name,sets=3,reps=""){
  const prev=lastFor(name);
  return {exId,name,sets:Array.from({length:sets},(_,i)=>{const p=prev&&prev.sets[i];return {kg:p?p.kg:"",reps:p?p.reps:(reps||""),done:false}})};
}

document.addEventListener("click",e=>{
  unlockAudio();
  const t=e.target.closest("[data-a],[data-tab]"); if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;libOpen=null;render();window.scrollTo(0,0);return}
  const a=t.dataset.a, A=S.active, ei=+t.dataset.e, si=+t.dataset.s;
  if(todayAction(a,t))return;
  switch(a){
    case "start": startWorkout(S.plans.find(p=>p.id===t.dataset.id)); break;
    case "start-empty": startWorkout(null); break;
    case "done": {
      const s=A.exercises[ei].sets[si]; s.done=!s.done;
      if(s.done){ if(s.kg===""){const p=lastFor(A.exercises[ei].name);} startRest(S.settings.rest); }
      touch(); render(); break;}
    case "add-set": {const ss=A.exercises[ei].sets,l=ss[ss.length-1];ss.push({kg:l?l.kg:"",reps:l?l.reps:"",done:false});touch();render();break}
    case "del-set": A.exercises[ei].sets.splice(si,1); touch(); render(); break;
    case "del-ex": A.exercises.splice(ei,1); touch(); render(); break;
    case "toggle": collapsed[+t.dataset.i]=!collapsed[+t.dataset.i]; render(); break;
    case "collapse-all": A.exercises.forEach((_,i)=>collapsed[i]=true); render(); break;
    case "expand-all": collapsed={}; render(); break;
    case "add-ex": pickExercise((exId,name)=>{A.exercises.push(newEx(exId,name));touch();render()}); break;
    case "pick": {const ex=libById(t.dataset.id);closeModal();window._pick&&window._pick(ex.id,shortName(ex));break}
    case "pick-custom": {const n=document.getElementById("customEx").value.trim();if(!n)return;closeModal();window._pick&&window._pick(null,n);break}
    case "close": closeModal(); break;
    case "rest-pause": if(!rest.end&&rest.paused==null)return; if(rest.paused!=null){rest.end=Date.now()+rest.paused*1000;rest.paused=null}else{rest.paused=restLeft();} tickTimers(); break;
    case "rest-skip": rest={end:0,paused:null,total:0}; tickTimers(); break;
    case "rest-add": if(rest.paused!=null)rest.paused+=+t.dataset.v; else if(rest.end){rest.end+= +t.dataset.v*1000;rest.total+= +t.dataset.v} tickTimers(); break;
    case "finish": {
      const done=A.exercises.reduce((a,x)=>a+x.sets.filter(s=>s.done).length,0);
      openModal(`<h3>Finish workout?</h3><p class="muted small">${done} sets done · ${fmt((Date.now()-A.start)/1000)} · ${Math.round(volume(A.exercises)).toLocaleString()} kg-reps. Only ticked sets are saved.</p>
      <div class="row"><button class="btn mint" style="flex:1" data-a="finish-yes">Save workout</button><button class="btn ghost" data-a="close">Keep going</button></div>`);break}
    case "finish-yes": {
      const exs=A.exercises.map(x=>({exId:x.exId,name:x.name,sets:x.sets.map(s=>({kg:num(s.kg),reps:num(s.reps),done:s.done}))})).filter(x=>x.sets.some(s=>s.done));
      S.history.push({id:uid(),date:Date.now(),planName:A.planName,duration:Math.round((Date.now()-A.start)/1000),volume:volume(exs),exercises:exs});
      S.active=null; rest={end:0,paused:null,total:0}; closeModal(); markDirty(); tab="history"; render(); toast("Workout saved 💪"); break}
    case "discard": openModal(`<h3>Discard this workout?</h3><p class="muted small">Nothing from this session will be saved.</p><div class="row"><button class="btn danger" style="flex:1" data-a="discard-yes">Discard</button><button class="btn ghost" data-a="close">Cancel</button></div>`);break;
    case "discard-yes": S.active=null; rest={end:0,paused:null,total:0}; closeModal(); touch(); render(); break;
    case "how": libOpen=t.dataset.id; figMode="good"; figT=0; tab="technique"; render(); window.scrollTo(0,0); break;
    case "sync-tap": if(!configured()||!G.email){tab="plans";render();window.scrollTo(0,document.body.scrollHeight)} else if(tokenOk())sync(); else signIn(); break;
    case "g-in": signIn(); break;
    case "g-out": signOut(); break;
    case "g-sync": tokenOk()?sync():signIn(); break;
    case "lib-back": libOpen=null; render(); break;
    case "fig-mode": figMode=t.dataset.v; figT=0; render(); break;
    case "fig-speed": figSpeed=figSpeed===1?0.4:1; render(); break;
    case "lib-group": libGroup=t.dataset.g; render(); break;
    case "hist": histOpen=histOpen===t.dataset.id?null:t.dataset.id; render(); break;
    case "del-hist": S.history=S.history.filter(h=>h.id!==t.dataset.id); S.deleted=(S.deleted||[]).concat(t.dataset.id); markDirty(); render(); break;
    case "edit-plan": editPlan(t.dataset.id); break;
    case "new-plan": editPlan(null); break;
    case "padd": pickExercise((exId,name)=>{window._plan.items.push({exId,name,sets:3,reps:10});drawPlan()}); break;
    case "pdel": window._plan.items.splice(+t.dataset.i,1); drawPlan(); break;
    case "pmove": {const it=window._plan.items,i=+t.dataset.i,j=i+ +t.dataset.d;if(j<0||j>=it.length)return;[it[i],it[j]]=[it[j],it[i]];drawPlan();break}
    case "psave": {const p=window._plan,isNew=p._new;delete p._new;if(isNew)S.plans.push(p);else S.plans=S.plans.map(x=>x.id===p.id?p:x);closeModal();S.plansU=Date.now();markDirty();render();toast("Plan saved");break}
    case "pdelete": S.plans=S.plans.filter(x=>x.id!==window._plan.id); closeModal(); S.plansU=Date.now(); markDirty(); render(); break;
    case "export": {const txt=JSON.stringify(S);
      openModal(`<div class="row between"><h3>Backup</h3><button class="x" data-a="close">×</button></div><p class="small muted">Copy this text and keep it somewhere safe (e.g. a note).</p><textarea id="bk" style="width:100%;height:160px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px">${esc(txt)}</textarea><button class="btn block" data-a="copy-bk">Copy</button>`);break}
    case "copy-bk": {const v=document.getElementById("bk").value;try{navigator.clipboard.writeText(v).then(()=>toast("Copied"),()=>{document.getElementById("bk").select();toast("Select all & copy")})}catch(err){document.getElementById("bk").select();toast("Select all & copy")}break}
    case "import": openModal(`<div class="row between"><h3>Restore backup</h3><button class="x" data-a="close">×</button></div><p class="small muted">Paste a backup. This replaces everything currently saved.</p><textarea id="bk" style="width:100%;height:160px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px"></textarea><button class="btn block" data-a="do-import">Restore</button>`);break;
    case "do-import": try{const d=JSON.parse(document.getElementById("bk").value);if(!d.plans||!d.history)throw 0;S=Object.assign(DEFAULT_STATE(),d);S.plansU=Date.now();closeModal();markDirty();render();toast("Restored")}catch(err){toast("That doesn't look like a valid backup")} break;
  }
});

document.addEventListener("input",e=>{
  const t=e.target, k=t.dataset.in; if(!k)return;
  if(k==="kg"||k==="reps"){S.active.exercises[+t.dataset.e].sets[+t.dataset.s][k]=t.value;touch();return}
  if(k==="libq"){libQuery=t.value;const pos=t.selectionStart;render();const n=document.querySelector('[data-in="libq"]');n.focus();n.setSelectionRange(pos,pos);return}
  if(k==="rest"){S.settings.rest=Math.max(5,parseInt(t.value)||60);S.plansU=Date.now();markDirty();return}
  if(k==="sname"){S.settings.name=t.value.trim();S.plansU=Date.now();markDirty();return}
  if(k==="wtarget"){S.settings.waterTarget=Math.max(250,Math.round(num(t.value)*1000)||3000);S.plansU=Date.now();markDirty();return}
  if(k==="wktarget"){S.settings.weeklyTarget=Math.max(1,parseInt(t.value)||3);S.plansU=Date.now();markDirty();return}
  if(k==="pname"){window._plan.name=t.value;return}
  if(k==="pset"){window._plan.items[+t.dataset.i].sets=Math.max(1,parseInt(t.value)||1);return}
  if(k==="preps"){window._plan.items[+t.dataset.i].reps=parseInt(t.value)||0;return}
});

/* ---- animation loop: live figure on detail page, gentle loop on thumbnails ---- */
let figMode="good", figSpeed=1, figT=0, lastFrame=0, thumbT=0;
function animate(ts){
  const dt=lastFrame?Math.min(.1,(ts-lastFrame)/1000):0; lastFrame=ts;
  const live=document.getElementById("figLive");
  if(live){
    figT+=dt*figSpeed;
    const id=live.dataset.fig, bad=figMode==="bad";
    live.innerHTML=FIG.svg(id,bad,figT);
    const [up,down]=FIG.tempo(id), hold=.35, T=up+down+hold*2, t=figT%T;
    const ph=document.getElementById("figPhase");
    if(ph){const ec=FIG.ecc(id),n=t<up?(ec?"LOWER":"LIFT"):t<up+hold?(ec?"BOTTOM":"SQUEEZE"):t<up+hold+down?(ec?"LIFT":"LOWER"):(ec?"TOP":"RESET");if(ph.textContent!==n){ph.textContent=n;ph.className="phase"+(n==="LOWER"?" lower":n==="LIFT"?"":" hold")}}
  }
  const thumbs=document.querySelectorAll(".thumb[data-fig]");
  if(thumbs.length){thumbT+=dt; if(!animate._th||ts-animate._th>66){animate._th=ts;thumbs.forEach(el=>el.innerHTML=FIG.svg(el.dataset.fig,false,thumbT))}}
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

initStorage();
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
